<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#141b18">
  <meta name="description" content="杀戮尖塔2全职业卡牌排行。七套独立模板、完整双语卡面、自由选牌与筛选，本地保存。">
  <title>尖塔排表 · 静默猎手</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="screenshot-import.css"><link rel="stylesheet" href="scheme-library.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="./"><span class="brand-mark">Ⅱ</span><span>尖塔排表<small>SLAY THE SPIRE 2</small></span></a><label class="version-control">游戏版本 <select id="game-version" aria-label="游戏版本"></select></label></header>
  <main>
    <section class="heading"><div class="heading-title"><div class="title-line"><h1 id="board-title">静默猎手 · 卡牌排行</h1><button id="edit-title" class="quiet" aria-label="修改标题" title="修改标题">✎</button></div></div><div class="heading-actions"><div class="screenshot-entry"><span class="screenshot-spark spark-left" aria-hidden="true">✦</span><span class="screenshot-spark spark-top" aria-hidden="true">✧</span><span class="screenshot-spark spark-right" aria-hidden="true">✦</span><span class="screenshot-arrow" aria-hidden="true">↴</span><button id="import-screenshot" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m8 0h3a2 2 0 0 0 2-2v-3M8 12h8"/></svg>导入截图</button></div></div></section>
    <nav id="template-tabs" class="template-tabs" aria-label="排表模板"></nav>
    <div class="toolbar"><div class="toolbar-group" role="group" aria-label="排表编辑"><button id="undo" title="撤销 (Ctrl+Z)" aria-label="撤销">↶</button><button id="redo" title="重做 (Ctrl+Shift+Z)" aria-label="重做">↷</button><span class="separator"></span><button id="add-tier">＋ 新增评级</button><button id="auto-colors" title="按评级顺序生成红、黄、绿渐变">自动配色</button><button id="clear-ranks" class="quiet" title="清空当前模板的评级，卡牌移回待排区；可撤销">清空评级</button></div><div class="toolbar-group" role="group" aria-label="卡面设置"><label class="language-control">卡面 <select id="card-language" aria-label="卡面语言"><option value="zh">简体中文</option><option value="en">English</option></select></label><label class="size-control">大小 <input id="card-size" aria-label="卡牌大小" type="range" min="68" max="132" value="88"></label></div><div class="toolbar-group toolbar-file-tools" role="group" aria-label="方案与导出"><button id="export-json" class="quiet">保存方案</button><button id="import-json" class="quiet">载入方案</button><div class="export-controls" role="group" aria-label="图片导出"><label><span class="sr-only">导出清晰度</span><select id="export-resolution" aria-label="导出清晰度"><option value="4">超清 · 6000 px</option><option value="3">高清 · 4500 px</option><option value="1.5">标准 · 2250 px</option></select></label><button id="export-png" class="primary">↓ 导出 PNG</button></div></div></div>
    <div class="workspace"><div class="board-column"><div class="board-note"><span id="board-count"></span></div>
      <div id="board-with-queue" class="board-with-queue"><section id="tier-board" aria-label="卡牌排行表"></section>
        <aside id="pending-queue" aria-labelledby="queue-title"><button id="queue-toggle" type="button" aria-expanded="true" aria-controls="queue-content" aria-label="折叠待排队列" title="折叠待排队列"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button><div id="queue-content"><h2 id="queue-title">待排队列</h2><div class="queue-tools"><div id="queue-skip-zone" title="待排牌拖入以暂时跳过；已评级牌拖入以从排表卡池移除">跳过</div><button id="queue-undo" type="button" title="撤回上一次跳过" aria-label="撤回上一次跳过" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 4 10l5 5M4 10h9a6 6 0 0 1 0 12" transform="translate(0 -2)"/></svg></button></div><div id="queue-cards" aria-label="待排队列卡牌"></div></div></aside>
      </div><section class="pool-section"><div class="pool-heading"><div><h2>待排卡牌 <span id="pool-count">0</span></h2></div><button id="manage-pool">＋ 选择卡牌</button></div>
      <div id="pool-filters" class="filter-bar" aria-label="待排筛选"></div>
      <div class="pool-sort-row"><span class="filter-label" id="pool-sort-label">排序</span><div id="pool-sort" role="group" aria-labelledby="pool-sort-label" aria-description="从左到右决定优先级。点击切换正序、逆序、不排；拖动或按 Alt 加左右键调整顺序。"></div></div>
      <div class="filter-search-row"><label class="filter-search"><span class="sr-only">名称</span><input id="search" type="search" placeholder="搜索中文名 / 英文名" aria-label="搜索待排卡牌"></label><button id="reset-filters" class="quiet">重置筛选</button></div>
      <div id="pool" class="card-zone pool" data-tier="pool" aria-label="待排卡牌"></div></section></div>
    </div>
  </main>
  <dialog id="card-dialog" aria-labelledby="detail-name">
    <div class="card-dialog-header"><span id="detail-number"></span><button id="close-card" aria-label="关闭卡牌图鉴" autofocus>×</button></div>
    <div id="detail-content"><button id="zoom-card" class="detail-image-button" title="放大卡牌" aria-label="放大完整卡面"><img id="detail-image" alt=""></button><div class="detail-info"><p id="detail-meta" class="eyebrow"></p><h2 id="detail-name"></h2><p id="detail-english"></p><div class="move-label">移至评级</div><div id="move-actions"></div><button id="move-pool" class="full-width">移回待排区</button></div></div>
  </dialog>
  <dialog id="image-dialog" aria-labelledby="dialog-caption"><div class="preview-tools"><button id="preview-zoom" hidden>放大到原始尺寸</button><button class="close-dialog" aria-label="关闭">×</button></div><img id="dialog-image" alt=""><p id="dialog-caption"></p><a id="download-link" hidden>保存 PNG 图片 ↓</a></dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title"><h2 id="confirm-title"></h2><p id="confirm-message"></p><div class="dialog-actions"><button id="cancel-confirm">取消</button><button id="accept-confirm" class="primary">确认</button></div></dialog>
  <dialog id="title-dialog" class="edit-dialog" aria-labelledby="title-dialog-heading"><form id="title-form"><h2 id="title-dialog-heading">修改排表标题</h2><label for="title-input">标题</label><input id="title-input" maxlength="80" required placeholder="给这张排表起个名字"><p id="title-error" class="form-error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel-title">取消</button><button class="primary" type="submit">保存标题</button></div></form></dialog>
  <dialog id="tier-dialog" class="edit-dialog" aria-labelledby="tier-dialog-title"><form id="tier-form"><h2 id="tier-dialog-title">编辑评级</h2><label for="tier-name">评级名称</label><textarea id="tier-name" maxlength="300" rows="3" required placeholder="例如：核心卡、优先拿取"></textarea><div class="tier-options"><label for="tier-color">颜色 <input id="tier-color" type="color" value="#efbd87"></label><label for="tier-position">位置 <select id="tier-position"></select></label></div><p id="tier-error" class="form-error" role="alert"></p><div class="dialog-actions"><button id="delete-tier" class="danger" type="button">删除评级</button><button id="cancel-tier" type="button">取消</button><button id="save-tier" class="primary" type="submit">保存评级</button></div></form></dialog>
  <dialog id="catalog-dialog" aria-labelledby="catalog-title">
    <div class="catalog-heading"><div><h2 id="catalog-title">选择待排卡牌</h2></div><button id="close-catalog" aria-label="关闭卡池选择">×</button></div>
    <div class="catalog-version-row"><label for="catalog-version">卡库版本 <select id="catalog-version" aria-label="卡库版本" aria-describedby="catalog-version-hint"></select></label><p id="catalog-version-hint">与排表版本不同的牌置顶，相同的牌灰显仍可选。跨版本添加会保留所选卡面与规则；当前卡库也显示已选版本外牌。</p></div>
    <div id="catalog-filters" class="filter-bar catalog-filters" aria-label="卡库筛选"></div>
    <div class="filter-search-row catalog-search-row"><label class="filter-search"><span class="sr-only">名称</span><input id="catalog-search" type="search" placeholder="搜索中文名 / 英文名" aria-label="搜索卡库"></label><button id="catalog-reset" class="quiet">重置筛选</button></div>
    <div class="catalog-bulk"><span id="catalog-results" role="status"></span><button id="catalog-select">全选筛选结果</button><button id="catalog-deselect">移除筛选结果</button></div>
    <div id="catalog-grid" aria-label="可选卡牌"></div>
    <div class="catalog-actions"><span id="catalog-selection" role="status"></span><button id="cancel-catalog">取消</button><button id="apply-catalog" class="primary">应用卡池</button></div>
  </dialog>
  <div id="toast" role="status"></div>
  <script src="cards.js"></script><script src="card-versions.js"></script><script src="versions.js"></script><script src="model.js"></script><script src="pool-sort.js"></script><script src="export.js"></script><script src="screenshot-engine.js"></script><script src="screenshot-ocr.js"></script><script src="screenshot-import.js"></script><script src="scheme-store.js"></script><script src="scheme-library.js"></script><script src="app.js"></script>
</body>
</html>
